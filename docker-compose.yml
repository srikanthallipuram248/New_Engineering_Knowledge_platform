services:
  postgres:
    image: postgres:16
    container_name: ekp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledge_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Srikanth@123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ekp-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ekp-api
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    restart: unless-stopped
    depends_on:
      - postgres
      - qdrant

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: ekp-web
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  postgres_data:
  qdrant_data:



